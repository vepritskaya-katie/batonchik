<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Батончик</title>
  <meta name="description" content="Тренировки щенка аусси Батончика: распорядок дня, команды, игры и советы">
  <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Батончик">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Тема до отрисовки, чтобы не мигало
    try { var t = localStorage.getItem('bt.theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/">
      <img src="icons/icon-192.png" alt="" width="32" height="32">
      <span>Батончик</span>
    </a>
    <span id="net" class="net" hidden>Нет сети</span>
    <a id="me-btn" class="me-btn" href="#/me" aria-label="Аккаунт и настройки"></a>
  </header>

  <main id="view" class="view" tabindex="-1">
    <noscript>Для работы приложения нужен JavaScript.</noscript>
  </main>

  <nav class="tabbar" aria-label="Разделы">
    <a href="#/" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M8.5 13l2.5 2.5 4.5-5"/></svg>
      <span>Сегодня</span></a>
    <a href="#/d" data-tab="d">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5v-15zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7.5h6M9 11h4"/></svg>
      <span>Дневник</span></a>
    <a href="#/k" data-tab="k">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="4.2" ry="3.6"/><circle cx="6" cy="10.5" r="1.9"/><circle cx="9.6" cy="6.6" r="1.9"/><circle cx="14.4" cy="6.6" r="1.9"/><circle cx="18" cy="10.5" r="1.9"/></svg>
      <span>Команды</span></a>
    <a href="#/g" data-tab="g">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4.5 9.5c3 1.5 12 1.5 15 0M4.5 14.5c3-1.5 12-1.5 15 0"/></svg>
      <span>Игры</span></a>
    <a href="#/t" data-tab="t">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span>Советы</span></a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-body" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
